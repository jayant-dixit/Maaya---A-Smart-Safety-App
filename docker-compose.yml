version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maaya_admin
      POSTGRES_PASSWORD: maaya_secure_dev_password
      POSTGRES_DB: maaya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maaya_admin -d maaya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maaya-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      DATABASE_URL: postgresql://maaya_admin:maaya_secure_dev_password@postgres:5432/maaya_db
      JWT_SECRET: dev_super_secret_jwt_key_change_in_production_32chars
      DASHBOARD_URL: http://localhost:5173
      SMS_PROVIDER: mock
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: maaya-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
